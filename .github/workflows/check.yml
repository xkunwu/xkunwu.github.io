name: Check site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          bundler-cache: true
      - run: bundle exec ruby scripts/site-references-test.rb
      - run: bundle exec ruby scripts/raster-slides-test.rb
      - run: make check
